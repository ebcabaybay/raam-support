<g transform="translate(440 30)"><rect width="240" height="40" rx="20" fill="#fff" opacity=".9"/><text x="120" y="27" text-anchor="middle" font-size="17" font-weight="700" fill="#6b2fa3">Valle Claro → Puerto Alto</text></g>
