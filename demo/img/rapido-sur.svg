<text x="254" y="26" text-anchor="end" font-size="14" font-weight="700" fill="#ffcf4a">ANDÉN</text>
<text x="16" y="52" font-size="20" font-weight="700" fill="#fff" font-family="Menlo, monospace">09:15 Puerto Alto</text>
<text x="254" y="52" text-anchor="end" font-size="22" font-weight="800" fill="#ffcf4a" font-family="Menlo, monospace">4</text>
