<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, Helvetica Neue, Arial, sans-serif">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b4fc7"/><stop offset=".65" stop-color="#e98a9b"/><stop offset="1" stop-color="#ffcf8a"/></linearGradient>
<linearGradient id="train" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcd6e6"/></linearGradient>
</defs>
<rect width="720" height="320" fill="url(#sky)"/>
<circle cx="560" cy="170" r="54" fill="#ffe3a3"/>
