<title>橙子外卖</title>

<body>
<div class="bar"><div class="logo">橙</div><div><h1>老街面馆</h1><small>月售 2000+ · 配送约 30 分钟</small></div></div>
<div class="tabs"><span>热销</span><span>招牌面</span><span>小吃</span><span>饮品</span><span>套餐</span></div>
<div class="wrap">
<div class="card warn"><h2>新客立减 8 元</h2><p>满 30 元可用，每位用户限用一次，活动截至本月底。</p></div>
<div class="card">
<div class="row"><div class="tile">🍜</div><div style="flex:1"><div class="item">招牌牛肉面</div><div class="desc">慢炖六小时的牛骨汤，微辣</div></div><div class="price">¥28</div></div>
<div class="row"><div class="tile">🥟</div><div style="flex:1"><div class="item">鲜肉小笼包（8个）</div><div class="desc">现包现蒸，含猪肉</div></div><div class="price">¥18</div></div>
<div class="row"><div class="tile">🌶️</div><div style="flex:1"><div class="item">麻辣凉面</div><div class="desc">重辣，含花生，可选少辣</div></div><div class="price">¥16</div></div>
<div class="row"><div class="tile">🥤</div><div style="flex:1"><div class="item">冰镇酸梅汤</div><div class="desc">店家自制，少糖</div></div><div class="price">¥8</div></div>
</div>
<div class="card"><h2>备注</h2><p>如有忌口或过敏，请在下单时备注。高峰时段配送可能延迟，敬请谅解。</p></div>
<a class="btn">去结算 · ¥54</a>
</div>
