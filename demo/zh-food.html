<style>:root { --brand: #f08c00; --brand2: #ffb02e; --soft: #fff1dc; --glow: rgba(240,140,0,.35); }
.bar { position: absolute; left: 0; right: 0; background: none; box-shadow: none; }
.shop-card .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg, var(--brand), #e2620d); color: #fff; font-size: 30px; font-weight: 800; display: grid; place-items: center; margin-top: -44px; border: 4px solid #fff; box-shadow: 0 6px 14px var(--glow); }
.coupon { display: flex; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #ff5a3c, #ff8a3c); color: #fff; }
.coupon .amt { padding: 14px 16px; border-right: 2px dashed rgba(255,255,255,.6); text-align: center; }
.coupon .amt b { font-size: 34px; } .coupon .amt small { font-size: 15px; font-weight: 700; }
.coupon .txt { padding: 12px 14px; flex: 1; }
.coupon h2 { font-size: 17px; margin-bottom: 2px; } .coupon p { font-size: 13px; opacity: .92; line-height: 1.4; }
.coupon .get { align-self: center; margin-right: 12px; background: #fff; color: #ff5a3c; font-weight: 700; font-size: 14px; padding: 7px 12px; border-radius: 99px; flex: none; }
</style>
</head>
<body>
<div class="bar"><span class="ib" style="background:rgba(0,0,0,.25)"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></span><div class="acts"><span class="ib" style="background:rgba(0,0,0,.25)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span><span class="ib" style="background:rgba(0,0,0,.25)"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v7h14v-7"/></svg></span></div></div>
<div class="cover"><img src="img/laojie-cover.svg" alt="手工拉面，骨汤慢炖6小时"></div>
<div class="shop-card card">
<div class="logo">橙</div>
<h2 style="margin-top:8px;font-size:22px">老街面馆</h2>
<div class="stars">★★★★★<span>4.9 · 月售 2000+ · 配送约 30 分钟</span></div>
<div style="margin-top:10px"><span class="pill">🛵 免配送费</span><span class="pill">🌶️ 川味</span><span class="pill">🏆 回头客多</span></div>
</div>
<div class="tabs"><span>热销</span><span>招牌面</span><span>小吃</span><span>饮品</span><span>套餐</span></div>
<div class="wrap">
<div class="coupon"><div class="amt"><small>¥</small><b>8</b></div><div class="txt"><h2>新客立减 8 元</h2><p>满 30 元可用，每位用户限用一次，活动截至本月底。</p></div><span class="get">领取</span></div>
<div class="sec">🔥 热销榜</div>
<div class="card">
<div class="dish"><div class="thumb" style="--g:linear-gradient(135deg,#ffd9b0,#f0954a)"><em>No.1</em>🍜</div><div class="grow"><div class="item">招牌牛肉面</div><div class="desc">慢炖六小时的牛骨汤，微辣</div><div class="foot"><span class="price">¥28<span class="old">¥32</span></span><span class="add">+</span></div></div></div>
<div class="dish"><div class="thumb" style="--g:linear-gradient(135deg,#fff0d6,#f2c98a)">🥟</div><div class="grow"><div class="item">鲜肉小笼包（8个）</div><div class="desc">现包现蒸，含猪肉</div><div class="foot"><span class="price">¥18</span><span class="add">+</span></div></div></div>
<div class="dish"><div class="thumb" style="--g:linear-gradient(135deg,#ffd6d0,#ec6a5a)"><em>辣</em>🌶️</div><div class="grow"><div class="item">麻辣凉面</div><div class="desc">重辣，含花生，可选少辣</div><div class="foot"><span class="price">¥16</span><span class="add">+</span></div></div></div>
<div class="dish"><div class="thumb" style="--g:linear-gradient(135deg,#f3dcef,#b9739f)">🥤</div><div class="grow"><div class="item">冰镇酸梅汤</div><div class="desc">店家自制，少糖</div><div class="foot"><span class="price">¥8</span><span class="add">+</span></div></div></div>
</div>
<div class="alert"><div class="ico">📝</div><div><h2>备注</h2><p>如有忌口或过敏，请在下单时备注。高峰时段配送可能延迟，敬请谅解。</p></div></div>
</div>

<script src="install.js" defer></script>

</html>
